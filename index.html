<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245c36"><title>Quadro de Manejo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;font-family:Arial,sans-serif;color:#17251c}.top{position:sticky;top:0;z-index:5;background:#245c36;color:white;padding:14px 10px 11px;text-align:center}.top h1{font-size:20px;margin:0}.top small{display:block;margin-top:3px;color:#dce9df}.wrap{max-width:760px;margin:auto;padding:8px}.field{background:white;border:1px solid #d8e0d9;border-radius:12px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 7px #0000000d}.fh{display:flex;justify-content:space-between;align-items:center;background:#e4eee6;padding:10px}.fname{font-weight:800;font-size:15px}.area{font-size:12px;font-weight:700;background:white;padding:4px 7px;border-radius:12px;color:#245c36}.empty{padding:10px;text-align:center;color:#7a847c;font-size:12px}.row{display:grid;grid-template-columns:48px minmax(65px,1fr) minmax(80px,1.2fr) 55px 52px;gap:3px;align-items:center;padding:7px 5px;border-bottom:1px solid #edf0ed;font-size:11px}.head{font-size:9px;font-weight:bold;color:#5c685f;background:#fafbfa}.cell{overflow:hidden;text-overflow:ellipsis}.acts{display:flex;gap:2px}.ico{border:0;background:#edf3ee;border-radius:6px;padding:5px}.del{background:#fbe9e9;color:#a11}.add{width:calc(100% - 16px);margin:8px;border:1px dashed #4c805c;background:#f5faf6;color:#245c36;font-weight:800;border-radius:8px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:15px;align-items:center;justify-content:center}.modal.on{display:flex}.box{width:min(100%,420px);background:white;border-radius:14px;padding:15px}.box h2{margin:0 0 10px;font-size:17px;color:#245c36}.lab{font-size:11px;font-weight:bold;margin:8px 0 4px;display:block}input,select{width:100%;height:41px;border:1px solid #cdd6cf;border-radius:8px;padding:7px;font-size:16px;background:white}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:8px;padding:11px;font-weight:bold}.save{background:#245c36;color:white}.cancel{background:#e9ece9;color:#39443c}</style></head><body>
<header class="top"><h1>QUADRO DE MANEJO</h1><small>Controle rápido das lavouras</small></header><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="box"><h2 id="mtitle"></h2><label class="lab">DIA</label><input id="dia" type="date"><label class="lab">TIPO DE MANEJO</label><select id="tipo"><option>Manejo de inverno</option><option>Dessecação</option><option>Plantio</option><option>Adubação</option><option>Capina</option><option>Fungicida</option><option>Herbicida</option><option>Inseticida</option><option>Colheita</option><option>Outro</option></select><label class="lab">PRODUTO</label><input id="produto" placeholder="Ex.: Glifosato"><label class="lab">DOSE</label><input id="dose" placeholder="Ex.: 2 L/ha"><div class="buttons"><button class="btn cancel" onclick="closeM()">CANCELAR</button><button class="btn save" onclick="save()">SALVAR</button></div></div></div>
<script>
const fields=[['FRENTE 16','16 HA'],['BERGAMOTEIRA','23 HA'],['MATO 53','53 HA'],['MATO NOVA 22','22 HA'],['FRENTE 29','29 HA'],['FRENTE 23','23,5 HA'],['TAPERA ADÃO','25 HA'],['SAIBRO EUCALIPTO','14,6 HA'],['VALDOMIRO','9,5 HA'],['OVELHAS','18 HA']];let data={0:[{dia:'2026-09-20',tipo:'Herbicida',produto:'Glifosato',dose:'2 L/ha'}]};let fi=null,ei=null;
function fmt(d){if(!d)return'';let p=d.split('-');return p[2]+'/'+p[1]}function render(){app.innerHTML=fields.map((f,i)=>{let rs=data[i]||[];return '<section class="field"><div class="fh"><span class="fname">'+f[0]+'</span><span class="area">'+f[1]+'</span></div>'+(rs.length?'<div class="row head"><span>DIA</span><span>TIPO</span><span>PRODUTO</span><span>DOSE</span><span>AÇÕES</span></div>'+rs.map((r,j)=>'<div class="row"><span>'+fmt(r.dia)+'</span><span class="cell">'+r.tipo+'</span><span class="cell">'+r.produto+'</span><span class="cell">'+r.dose+'</span><span class="acts"><button class="ico" onclick="openM('+i+','+j+')">✎</button><button class="ico del" onclick="del('+i+','+j+')">×</button></span></div>').join(''):'<div class="empty">Nenhum manejo lançado</div>')+'<button class="add" onclick="openM('+i+')">+ MANEJO</button></section>'}).join('')}
function openM(i,j){fi=i;ei=(j===undefined?null:j);mtitle.textContent=(ei===null?'NOVO MANEJO — ':'EDITAR — ')+fields[i][0];let r=ei===null?{}:data[i][ei];dia.value=r.dia||new Date().toISOString().slice(0,10);tipo.value=r.tipo||'Manejo de inverno';produto.value=r.produto||'';dose.value=r.dose||'';modal.classList.add('on')}function closeM(){modal.classList.remove('on')}function save(){if(!dia.value||!produto.value.trim()||!dose.value.trim()){alert('Preencha DIA, PRODUTO e DOSE.');return}let r={dia:dia.value,tipo:tipo.value,produto:produto.value.trim(),dose:dose.value.trim()};data[fi]=data[fi]||[];if(ei===null)data[fi].push(r);else data[fi][ei]=r;closeM();render()}function del(i,j){if(confirm('Excluir este manejo?')){data[i].splice(j,1);render()}}modal.onclick=e=>{if(e.target===modal)closeM()};render();
</script></body></html>
