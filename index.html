<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245c36"><link rel="icon" type="image/jpeg" href="LogoTrator.png"><link rel="apple-touch-icon" href="LogoTrator.png"><title>Quadro de Manejo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;font-family:Arial,sans-serif;color:#17251c}.top{position:sticky;top:0;z-index:5;background:#245c36;color:white;padding:14px 10px 11px;text-align:center}.top h1{font-size:20px;margin:0}.top small{display:block;margin-top:3px;color:#dce9df}.wrap{max-width:760px;margin:auto;padding:8px}.field{background:white;border:1px solid #d8e0d9;border-radius:12px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 7px #0000000d}.fh{display:flex;justify-content:space-between;align-items:center;background:#e4eee6;padding:10px}.fname{font-weight:800;font-size:15px}.area{font-size:12px;font-weight:700;background:white;padding:4px 7px;border-radius:12px;color:#245c36}.finfo{display:flex;flex-direction:column}.variedade-tag{font-size:10px;font-weight:700;color:#245c36;margin-top:2px}.empty{padding:10px;text-align:center;color:#7a847c;font-size:12px}.row{display:grid;grid-template-columns:48px minmax(65px,1fr) minmax(80px,1.2fr) 55px 52px;gap:3px;align-items:center;padding:7px 5px;border-bottom:1px solid #edf0ed;font-size:11px}.head{font-size:9px;font-weight:bold;color:#5c685f;background:#fafbfa}.cell{overflow:hidden;text-overflow:ellipsis}.manejo-card{margin:6px 8px;padding:9px;border:1px solid #dfe7e0;border-radius:9px;background:#fbfcfb}.manejo-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}.manejo-dia{font-weight:800;color:#245c36;font-size:12px}.manejo-tipo{font-weight:800;font-size:12px;flex:1}.manejo-produtos{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 8px;background:#f3f7f4;border-radius:7px;font-size:12px}.manejo-produto{font-weight:700}.manejo-dose{font-weight:700;color:#245c36}.manejo-acoes{display:flex;gap:3px}.acts{display:flex;gap:2px}.ico{border:0;background:#edf3ee;border-radius:6px;padding:5px}.del{background:#fbe9e9;color:#a11}.add{width:calc(100% - 16px);margin:8px;border:1px dashed #4c805c;background:#f5faf6;color:#245c36;font-weight:800;border-radius:8px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:15px;align-items:center;justify-content:center}.modal.on{display:flex}.box{width:min(100%,420px);background:white;border-radius:14px;padding:15px}.box h2{margin:0 0 10px;font-size:17px;color:#245c36}.lab{font-size:11px;font-weight:bold;margin:8px 0 4px;display:block}.plantio-title{font-size:13px;font-weight:900;color:#245c36;margin:10px 0 6px}.plantio-grid{display:grid;grid-template-columns:1.7fr .8fr .9fr .9fr 1.15fr;gap:6px;align-items:end}.plantio-grid .lab{margin:0 0 3px;font-size:9px}.plantio-grid input{height:36px;font-size:14px;padding:5px}.plantio-total{background:#eef2ef}.plantio-info{margin-top:8px;padding:7px 9px;border:1px solid #c9d9cc;border-radius:8px;background:#f2f8f3;color:#245c36;font-size:11px;text-align:center}@media(max-width:520px){.plantio-grid{grid-template-columns:1.5fr .7fr .8fr .8fr 1.05fr;gap:4px}.plantio-grid input{font-size:12px;padding:4px}.plantio-grid .lab{font-size:8px}}input,select{width:100%;height:41px;border:1px solid #cdd6cf;border-radius:8px;padding:7px;font-size:16px;background:white}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:8px;padding:11px;font-weight:bold}.save{background:#245c36;color:white}.cancel{background:#e9ece9;color:#39443c}@media print{body{background:white}.top,.modal,#app{display:none!important}#report{display:block!important}.reportbox{box-shadow:none!important;max-width:none!important;margin:0!important;padding:0!important}.rclose,.printbtn{display:none!important}}#report{display:none;position:fixed;inset:0;background:#f2f5f1;z-index:30;overflow:auto;padding:10px}.reportbox{max-width:760px;margin:auto;background:white;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0002}.rtitle{text-align:center;margin:0;color:#245c36;font-size:20px}.rsub{text-align:center;margin:3px 0 16px;font-size:12px}.rfield{margin:15px 0 5px;background:#e4eee6;padding:8px;font-weight:bold;border-radius:6px}.rtable{width:100%;border-collapse:collapse;font-size:11px}.rtable th,.rtable td{border:1px solid #d9dfda;padding:6px;text-align:left}.rtable th{background:#f5f7f5}.rbuttons{display:flex;gap:8px;justify-content:center;margin:18px 0}.rbuttons button{border:0;border-radius:8px;padding:10px 18px;font-weight:bold}.rclose{background:#e9ece9}.printbtn{background:#245c36;color:white}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body>
<header class="top"><img src="LogoTrator.png" alt="Manejo da Lavoura" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px"><h1>QUADRO DE MANEJO</h1><small>Controle rápido das lavouras</small></header><main class="wrap"><div style="display:flex;gap:8px;align-items:stretch;margin:2px 0 10px"><button onclick="openReport()" style="flex:1;border:0;background:#fff;color:#245c36;border-radius:10px;padding:11px;font-weight:800;box-shadow:0 2px 7px #00000012">📄 RELATÓRIO GERAL</button><div style="background:#e4eee6;color:#245c36;border-radius:10px;padding:7px 12px;text-align:center;min-width:105px;box-shadow:0 2px 7px #0000000d"><div style="font-size:10px;font-weight:700">ÁREA TOTAL</div><div style="font-size:18px;font-weight:900">235 HA</div></div></div><div id="app"></div></main>
<div id="report"><div class="reportbox"><h1 class="rtitle">AGROPECUÁRIA PAINEIRA</h1><div class="rsub">RELATÓRIO GERAL DE MANEJOS</div><div id="reportContent"></div><div class="rbuttons"><button class="rclose" onclick="closeReport()">VOLTAR</button><button class="printbtn" onclick="window.print()">IMPRIMIR</button><button class="printbtn" onclick="downloadPDF()">BAIXAR PDF</button></div></div></div><div class="modal" id="modal"><div class="box"><h2 id="mtitle"></h2><label class="lab">DIA</label><input id="dia" type="date"><label class="lab">TIPO DE MANEJO</label><select id="tipo"><option>Manejo de inverno</option><option>Dessecação</option><option>Plantio</option><option>Adubação</option><option>Capina</option><option>Fungicida</option><option>Herbicida</option><option>Inseticida</option><option>Colheita</option><option>Outro</option></select><div id="plantioBox" style="display:none"><div class="plantio-title">DADOS DO PLANTIO</div><div class="plantio-grid"><div><label class="lab">VARIEDADE</label><input id="variedade" placeholder="BMX ZEUS"></div><div><label class="lab">GM</label><input id="gm" placeholder="6.2"></div><div><label class="lab">CICLO</label><input id="ciclo" placeholder="120"></div><div><label class="lab">KG/HA</label><input id="kgha" type="number" step="0.01" inputmode="decimal" placeholder="70"></div><div><label class="lab">TOTAL</label><input id="totalArea" class="plantio-total" readonly placeholder="—"></div></div><div class="plantio-info" id="plantioInfo">TOTAL PARA A ÁREA = KG/HA × ÁREA</div></div><div id="produtosBox"><label class="lab">PRODUTOS E DOSES</label><div id="produtos"></div><button type="button" class="add" style="margin:8px 0;width:100%" onclick="addProduto()">+ ADICIONAR PRODUTO</button></div><div class="buttons"><button class="btn cancel" onclick="closeM()">CANCELAR</button><button class="btn save" onclick="save()">SALVAR</button></div></div></div>
<script>
const fields=[['FRENTE 16','16 HA'],['FRENTE 29','29 HA'],['FRENTE 3','3 HA'],['FRENTE 14','14 HA'],['FRENTE 9','9 HA'],['FUNDO OVELHA 10','10 HA'],['FUNDO OVELHA 8','8 HA'],['FUNDO SAIBRO 14','14 HA'],['FUNDO BERGAMOTEIRA 23','23 HA'],['FUNDO TAPERA 25','25 HA'],['FUNDO ÁREA NOVA 22','22 HA'],['FUNDO MATO 53','53 HA'],['FUNDO VALDOMIRO 9','9 HA']];let data={0:[{dia:'2026-09-20',tipo:'Herbicida',produto:'Glifosato',dose:'2 L/ha'}]};let fi=null,ei=null;
function fmt(d){if(!d)return'';let p=d.split('-');return p[2]+'/'+p[1]}
function productRows(r){let ps=r.produtos&&r.produtos.length?r.produtos:[{produto:r.produto||'',dose:r.dose||''}];return ps.map(p=>({produto:p.produto||'',dose:p.dose||''}))}
function render(){app.innerHTML=fields.map((f,i)=>{let rs=data[i]||[];let plantios=rs.filter(x=>x.tipo==='Plantio'&&x.variedade);let pl=plantios.length?plantios[plantios.length-1]:null;let v=pl?pl.variedade:'';return '<section class="field"><div class="fh"><span class="fname">'+f[0]+'</span>'+(v?'<span class="variedade-tag" style="margin:0;flex:1;text-align:center">VARIEDADE: '+v+'</span>':'<span style="flex:1"></span>')+'<span class="area">'+f[1]+'</span></div>'+(rs.length?rs.map((r,j)=>{let ps=productRows(r);let corpo=r.tipo==='Plantio'?'<div class="manejo-produtos"><span>GM</span><span><b>'+((r.gm)||'')+'</b></span><span>CICLO</span><span><b>'+((r.ciclo)||'')+'</b></span><span>KG/HA</span><span><b>'+((r.kgha)||'')+'</b></span><span>TOTAL PARA ÁREA</span><span><b>'+((r.totalArea)||'')+' KG</b></span></div>':'<div class="manejo-produtos">'+ps.map(p=>'<span class="manejo-produto">'+p.produto+'</span><span class="manejo-dose">'+p.dose+'</span>').join('')+'</div>';return '<div class="manejo-card"><div class="manejo-top"><span class="manejo-dia">'+fmt(r.dia)+'</span><span class="manejo-tipo">'+r.tipo+'</span><span class="manejo-acoes"><button class="ico" onclick="openM('+i+','+j+')">✎</button><button class="ico del" onclick="del('+i+','+j+')">×</button></span></div>'+corpo+'</div>'}).join(''):'<div class="empty">Nenhum manejo lançado</div>')+'<button class="add" onclick="openM('+i+')">+ MANEJO</button></section>'}).join('')}
function downloadPDF(){const el=document.querySelector('.reportbox');const buttons=el.querySelector('.rbuttons');buttons.style.display='none';const opt={margin:8,filename:'RELATORIO_GERAL_DE_MANEJOS.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}};html2pdf().set(opt).from(el).save().then(()=>{buttons.style.display='flex'}).catch(()=>{buttons.style.display='flex';alert('Não foi possível gerar o PDF.')})}
function addProduto(p='',d=''){const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:1fr 70px 58px 34px;gap:5px;margin-bottom:6px';let dv=String(d),m=dv.match(/^(.*?)(?:\s+(L|KG))?$/i),doseVal=(m&&m[1]?m[1]:dv),unit=(m&&m[2]?m[2].toUpperCase():'L');row.innerHTML='<input class="pname" placeholder="Produto" value="'+String(p).replace(/"/g,'&quot;')+'"><input class="pdose" placeholder="Dose" value="'+doseVal.replace(/"/g,'&quot;')+'"><select class="punit"><option value="L" '+(unit==='L'?'selected':'')+'>L</option><option value="KG" '+(unit==='KG'?'selected':'')+'>KG</option></select><button type="button" class="ico del" onclick="this.parentElement.remove()">×</button>';produtos.appendChild(row)}
function openReport(){let out='';fields.forEach((f,i)=>{let rs=(data[i]||[]).slice().sort((a,b)=>a.dia.localeCompare(b.dia));if(!rs.length)return;let plantios=rs.filter(x=>x.tipo==='Plantio'&&x.variedade);let ult=plantios.length?plantios[plantios.length-1]:null;out+='<div class="rfield">'+f[0]+' — '+f[1]+(ult?' &nbsp; | &nbsp; VARIEDADE: '+ult.variedade:'')+'</div><table class="rtable"><thead><tr><th>DIA</th><th>TIPO DE MANEJO</th><th>INFORMAÇÕES</th><th>DOSE/TOTAL</th></tr></thead><tbody>'+rs.map(r=>{if(r.tipo==='Plantio')return '<tr><td>'+fmt(r.dia)+'</td><td>Plantio</td><td><b>GM:</b> '+(r.gm||'')+' &nbsp; <b>CICLO:</b> '+(r.ciclo||'')+'<br><b>KG/HA:</b> '+(r.kgha||'')+'</td><td><b>TOTAL:</b> '+(r.totalArea||'')+' KG</td></tr>';return productRows(r).map((p,k)=>'<tr><td>'+(k===0?fmt(r.dia):'')+'</td><td>'+(k===0?r.tipo:'')+'</td><td>'+p.produto+'</td><td>'+p.dose+'</td></tr>').join('')}).join('')+'</tbody></table>'});reportContent.innerHTML=out||'<div class="empty">Nenhum manejo lançado.</div>';report.style.display='block'}
function closeReport(){report.style.display='none'}
function openM(i,j){fi=i;ei=(j===undefined?null:j);mtitle.textContent=(ei===null?'NOVO MANEJO — ':'EDITAR — ')+fields[i][0];let r=ei===null?{}:data[i][ei];dia.value=r.dia||new Date().toISOString().slice(0,10);tipo.value=r.tipo||'Manejo de inverno';variedade.value=r.variedade||'';gm.value=r.gm||'';ciclo.value=r.ciclo||'';kgha.value=r.kgha||'';totalArea.value=r.totalArea||'';togglePlantio();produtos.innerHTML='';productRows(r).forEach(p=>addProduto(p.produto,p.dose));modal.classList.add('on')}
function closeM(){modal.classList.remove('on')}
function save(){let isPlantio=tipo.value==='Plantio';let ps=[...produtos.children].map(x=>({produto:x.querySelector('.pname').value.trim(),dose:x.querySelector('.pdose').value.trim()+' '+x.querySelector('.punit').value})).filter(p=>p.produto);if(!dia.value){alert('Preencha o DIA.');return}if(isPlantio){if(!variedade.value.trim()||!gm.value.trim()||!ciclo.value.trim()||!kgha.value){alert('Preencha VARIEDADE, GM, CICLO e KG/HA.');return}}else if(!ps.length){alert('Adicione pelo menos um PRODUTO e DOSE.');return}let area=parseFloat(fields[fi][1]);let total=isPlantio?(parseFloat(String(kgha.value).replace(',','.'))*area):0;let r={dia:dia.value,tipo:tipo.value,produtos:isPlantio?[]:ps,variedade:isPlantio?variedade.value.trim():'',gm:isPlantio?gm.value.trim():'',ciclo:isPlantio?ciclo.value.trim():'',kgha:isPlantio?kgha.value:'',totalArea:isPlantio?String(Math.round(total*100)/100).replace('.',','):''};data[fi]=data[fi]||[];if(ei===null)data[fi].push(r);else data[fi][ei]=r;closeM();render()}
function del(i,j){if(confirm('Excluir este manejo?')){data[i].splice(j,1);render()}}
function togglePlantio(){let p=tipo.value==='Plantio';plantioBox.style.display=p?'block':'none';produtosBox.style.display=p?'none':'block';if(p)calcTotal()}function calcTotal(){if(fi===null)return;let area=parseFloat(fields[fi][1]);let kg=parseFloat(String(kgha.value).replace(',','.'));let t=isNaN(kg)?'':String(Math.round(kg*area*100)/100).replace('.',',');totalArea.value=t?t+' KG':'';plantioInfo.textContent=t?'TOTAL PARA A ÁREA = '+kgha.value+' KG/HA × '+area+' HA = '+t+' KG':'TOTAL PARA A ÁREA = KG/HA × '+area+' HA'}tipo.onchange=togglePlantio;kgha.oninput=calcTotal;modal.onclick=e=>{if(e.target===modal)closeM()};render();
</script></body></html>
